[package]
name = "benchmarks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
terminal-core = { path = "../crates/terminal-core" }
terminal-parser = { path = "../crates/terminal-parser" }
