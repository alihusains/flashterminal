terminal-session = { path = "../crates/terminal-session" }
terminal-workspace = { path = "../crates/terminal-workspace" }
pty = { path = "../crates/pty" }
terminal-text = { path = "../crates/terminal-text" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
