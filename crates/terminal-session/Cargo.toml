[package]
name = "terminal-session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
terminal-core = { path = "../terminal-core" }
terminal-parser = { path = "../terminal-parser" }
pty = { path = "../pty" }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = "1"
chrono = { workspace = true }
keyring = { workspace = true }
ureq = { version = "2.10", features = ["tls"] }

[dev-dependencies]
pty = { path = "../pty" }

[features]
default = []
real-agents = []

# Without this, `tests/real_agents.rs` is discovered and built like any
# other integration test — the `real-agents` feature name is otherwise
# purely aspirational, and the suite runs (and calls out to whatever real
# agent binaries happen to be on PATH) under plain `cargo test --workspace`.
[[test]]
name = "real_agents"
path = "tests/real_agents.rs"
required-features = ["real-agents"]
